[tox]
isolated_build = True
skipsdist = True

envlist =
    lint
    flake8
    mypy
    codespell
    py

[testenv]
allowlist_externals =
    uv
commands =
    uv run pytest
description = Run unit tests with pytest. This environment has no name of its own: use "py".

[testenv:lint]
deps =
    black
    isort
skip_install = true
commands =
    black --check --diff src/ tests/
    isort --check-only --diff src/ tests/
description = Check formatting without changing anything, so that CI can fail on it.

[testenv:format]
deps =
    black
    isort
skip_install = true
commands =
    black src/ tests/
    isort src/ tests/
description = Fix formatting.

[testenv:flake8]
skip_install = true
deps =
    darglint
    flake8
    flake8-black
    flake8-bandit
    flake8-bugbear
    flake8-colors
    flake8-docstrings
    flake8-isort
    flake8-print
    pydocstyle
commands =
    flake8 src/ tests/
description = Run the flake8 tool with several plugins (bandit, docstrings, import order, pep8 naming).

[flake8]
max-line-length = 100
ignore =
    # Missing parameter(s) in Docstring: - with_git_hash
    DAR101
    # Missing "Returns" in Docstring: - return
    DAR201
    # Missing "Yields" in Docstring: - yield
    DAR301
    # Missing exception(s) in Raises section: -r ValueError
    DAR401
    # whitespace before ':'
    E203
    # print found.
    T201
    # line break before binary operator
    W503
    # Missing docstrings in public classes, methods, functions, packages, magic methods
    D101
    D102
    D103
    D104
    D105
    # Missing docstring in __init__
    D107
    # No blank lines allowed after function docstring
    D202
    # No blank lines allowed between a section header and its content
    D412
    # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
    S101
per-file-ignores =
    # The tests run node on a fixed script
    tests/test_web.py: S404,S603,S607

[testenv:mypy]
deps =
    mypy
skip_install = true
commands =
    mypy --install-types --non-interactive --ignore-missing-imports --no-strict-optional --follow-imports skip --no-warn-no-return src/
description = Run the mypy tool to check static typing on the project.

[testenv:codespell]
description = Run spell checker.
skip_install = true
deps =
    codespell
    tomli  # required for getting config from pyproject.toml
commands =
    codespell src/ tests/ docs/index.html docs/app.js docs/core.js README.md
