[project]
name = "pubmatrix-reloaded"
version = "0.2.0"
description = "PubMatrix rebuilt on PubTator3: pairwise literature matrices from two term lists."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "J. Harry Caufield", email = "jhc@lbl.gov" }]
dependencies = ["httpx>=0.27", "openpyxl>=3.1", "tzdata"]

[project.scripts]
pubmatrix = "pubmatrix.cli:main"

[dependency-groups]
dev = ["pytest>=8", "tox>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubmatrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py313"]

[tool.isort]
profile = "black"
line_length = 100
reverse_relative = true

[tool.codespell]
skip = '.git,output'
ignore-words-list = 'als'
